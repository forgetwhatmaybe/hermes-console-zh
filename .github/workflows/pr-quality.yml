name: Code Quality Checks

on:
  pull_request:
    # Also the 1.2.15 integration and review-only bases, so reviewers see CI.
    branches: [main, 'feat/**', 'review/**']
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
        id: pub_get

      - name: Verify generated localizations
        run: |
          flutter gen-l10n
          git diff --exit-code -- \
            lib/l10n/app_localizations.dart \
            lib/l10n/app_localizations_en.dart \
            lib/l10n/app_localizations_es.dart

      - name: Install REUSE
        run: python3 -m pip install --disable-pip-version-check reuse==6.2.0

      # Blocking on purpose: it passes now that REUSE.toml covers *.cmd. It only
      # goes red when someone adds a tracked file without a licence declaration,
      # which is a one-line fix in REUSE.toml — worth stopping on.
      - name: Verify REUSE compliance
        run: reuse lint

      - name: Scan Git history with Gitleaks
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            zricethezav/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            git /repo --no-banner --redact=100

      - name: Scan verified and unknown secrets with TruffleHog
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            trufflesecurity/trufflehog@sha256:ff4c95e9df7d645daf2140e3ca1039031c63106268d5fbb25feb43ceca1bcc33 \
            --no-update --fail --fail-on-scan-errors \
            --exclude-detectors=URI --results=verified,unknown \
            --json git file:///repo \
            > "$RUNNER_TEMP/trufflehog.jsonl"
          test ! -s "$RUNNER_TEMP/trufflehog.jsonl"

      # Stays blocking: a swapped wrapper jar is a supply-chain signal, not a
      # freshness nit. Split out from the SBOM half below so that only the
      # regeneration is tolerated.
      - name: Verify Gradle wrapper hash
        run: |
          echo "76805e32c009c0cf0dd5d206bddc9fb22ea42e84db904b764f3047de095493f3  android/gradle/wrapper/gradle-wrapper.jar" \
            | sha256sum -c -

      # Non-blocking on this fork only. This step re-generates sbom/ and requires
      # the committed bytes to match, so any version bump or asset change turns
      # it red until someone re-generates. Generation needs Linux (generate.py
      # shells out to android/gradlew), a JDK and the Android SDK — this
      # workstation has none of the three, and sbom/source-assets.json also
      # embeds an asset input fingerprint that drifts on its own. Background:
      # AGENTS.md § CI gates.
      - name: Verify source SBOMs are fresh
        continue-on-error: true
        run: |
          ./tool/sbom/generate.sh
          # Print what drifted before failing: the diff is the only way to tell
          # "a version bump needs a regenerate" apart from "source-assets.json
          # fingerprint drifted on its own". The job log keeps these 400 lines.
          git --no-pager diff --stat -- sbom || true
          git --no-pager diff -- sbom | head -400 || true
          git diff --exit-code -- sbom

      - name: Run Python security and SBOM tests
        run: python3 -m unittest discover -s test -p '*_test.py'

      # ── Step 1: Static analysis ──────────────────────────
      - name: Static analysis
        id: analyze
        continue-on-error: true
        run: |
          flutter analyze --fatal-infos 2>&1 | tee analyze_output.txt
          exit "${PIPESTATUS[0]}"

      # ── Step 2: Run tests ────────────────────────────────
      - name: Run tests
        id: test
        continue-on-error: true
        run: |
          flutter test --concurrency=1 --reporter=expanded 2>&1 | tee test_output.txt
          exit "${PIPESTATUS[0]}"

      # ── Step 3: Summary & failure report ─────────────────
      # GitHub aborts step summaries over 1MB ("supports content up to a size
      # of 1024k, got 3842k"), so this step never echoes a full log. It lists
      # the failing test names, each with its real diagnostic: the exception
      # block printed BEFORE the [E] marker for widget/golden failures
      # ("Test failed. See exception logs above." carries nothing actionable),
      # or the first Expected/Actual paragraph after it for ordinary matcher
      # failures. Blocks are attributed to the failing test by the progress-message
      # name in effect above the banner plus the test file in the block's stack
      # frames, so a passing test's planted exception is never pinned on a failure.
      # Hard-capped at ~900KB; the complete output stays in the job log.
      - name: Failure summary
        if: steps.analyze.outcome != 'success' || steps.test.outcome != 'success'
        env:
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          python3 - <<'PYEOF'
          import os
          import re
          import textwrap

          # Byte budget keeps the summary well under GitHub's 1024k abort. The final
          # truncation note is appended outside write_block, so the block budget keeps
          # NOTE_RESERVE free for it and the finished markdown stays within the cap.
          MAX_SUMMARY_BYTES = 900 * 1024
          NOTE_RESERVE = 1024
          ANALYZE_MAX_CHARS = 64 * 1024   # analyze output is short; cap anyway
          ERROR_MAX_CHARS = 600           # first error paragraph per failure
          EXC_MAX_CHARS = 1600            # exception block preceding an [E] line
          TAIL_LINES = 60                 # fallback when no [E] line exists
          TAIL_MAX_CHARS = 16 * 1024

          summary = open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8")
          used = 0
          truncated = False

          def write_block(text):
              global used, truncated
              size = len(text.encode("utf-8"))
              if used + size > MAX_SUMMARY_BYTES - NOTE_RESERVE:
                  truncated = True
                  return
              summary.write(text)
              used += size

          def codeblock(text):
              fence = "```"
              for run in re.findall(r"`{3,}", text):
                  fence = max(fence, run + "`", key=len)
              return fence + "\n" + text.rstrip("\n") + "\n" + fence + "\n"

          # flutter test --reporter=expanded marks failures with [E]. Progress lines look
          # like "MM:SS +N ~K -M: <name>"; a long name can wrap onto the following
          # indented lines. Two failure shapes exist:
          #
          #   1. Widget/golden (framework-caught) failures print the exception block
          #      between the ╡...╞ banner and the [E] line, and only print "Test failed.
          #      See exception logs above." after it. The actionable diagnostic is the
          #      block BEFORE [E]; the text after is just a pointer into the job log.
          #   2. Ordinary matcher failures print the Expected/Actual paragraph after the
          #      [E] line, up to the first blank line.
          #
          # So each [E] failure carries the exception block collected before its [E]
          # line when there is one, and falls back to the after-paragraph otherwise.
          #
          # Attribution guard, two keys:
          #   1. Owner name: a block belongs to a failure only when the progress-
          #      message name in effect on the line above the banner (or carried
          #      through continuation banners, which inherit it) equals the failing
          #      test's name. This is what keeps a PASSING test's planted exception
          #      (its own banner block, followed by no [E] of its own) from being
          #      handed to a later failing test in the same file.
          #   2. Test file: the failure's file must also appear in the block's own
          #      stack frames (".../test/<file>.dart"). Blocks whose frames name
          #      another file stay pending for their real owner (a passing test's
          #      planted exception can sit right above an unrelated [E] in
          #      interleaved logs). A group of blocks with no test frame at all
          #      (e.g. Flutter's "Multiple exceptions (N)" note) falls back to the
          #      failure counter: the -M counter increments exactly once per failed
          #      test at its exception, so the group matches an [E] whose counter is
          #      one above the counter in effect when the group opened; counters
          #      never decrease, so a rejected group is dropped rather than pinned
          #      on a later failure.
          PROG = re.compile(r"^\d+:\d\d \+\d+(?: ~\d+)?(?: -\d+)?: ")
          COUNTER = re.compile(r"-(\d+)")
          NAME_FILE = re.compile(r"^(.*\.dart): ")
          FRAME_FILE = re.compile(r"(?:file:///)?[^\s'*\"]*[/\\]test[/\\]([\w\-./\\]+\.dart)")
          BANNER_OPEN = re.compile(r"^\s*═*\s*╡.*╞\s*═*\s*$")
          BANNER_CLOSE = re.compile(r"^\s*═+\s*$")
          BANNER_ANY = re.compile(r"^\s*(?:═*\s*╡.*╞\s*═*|═+)\s*$")

          def line_counter(raw):
              m = COUNTER.search(PROG.match(raw).group(0))
              return int(m.group(1)) if m else 0

          def name_file(name):
              m = NAME_FILE.match(name)
              return m.group(1).replace("\\", "/") if m else None

          def block_file(block_lines):
              for l in block_lines:
                  m = FRAME_FILE.search(l)
                  if m:
                      return m.group(1).replace("\\", "/")
              return None

          def parse_failures(lines):
              failures = []          # (name, error_text, from_exception_block)
              names_seen = set()
              name = None            # failing test awaiting its error text
              err = []               # paragraph collected after [E]
              failure_exc = []       # exception block claimed by the current failure
              pending_blocks = []    # (owner_name, lines): blocks awaiting their owner
              cur_block = None       # block being collected right now
              block_pre_m = None     # counter in effect when the first pending block opened
              last_m = 0             # counter of the most recent progress line
              collecting = False     # inside a ╡...╞-delimited exception block
              pending = ""           # wrapped long test name accumulated so far
              cur_owner = None       # progress-name in effect at this point in the log

              def flush():
                  # Closes the open failure. Its exception block, if any, was claimed
                  # at its [E] line; the block wins over the after-paragraph, which is
                  # then just the "See exception logs above." pointer.
                  nonlocal name, err, failure_exc
                  if name is not None and name not in names_seen:
                      names_seen.add(name)
                      block = "\n".join(failure_exc).strip()
                      if block:
                          failures.append((name, block, True))
                      else:
                          text = textwrap.dedent("\n".join(
                              l for l in err if not BANNER_ANY.match(l))).strip()
                          failures.append((name, text, False))
                  name = None
                  err = []
                  failure_exc = []

              def claim(m, fname, owner):
                  # Hands a pending block over only when the name in effect above its
                  # banner belongs to the failing test: equality, or the wrapped-name
                  # case where the [E] name extends the progress name across lines
                  # (then block frames and the failure must also name the same test
                  # file). Anything else keeps owner-named blocks pending — only
                  # their own owner's [E] can claim them later — so a passing test's
                  # planted exception (its own banner, followed by no [E] of its
                  # own) is never pinned on a later failure. Ownerless, fileless
                  # groups (banners printed before the first progress line) fall
                  # back to the failure counter: the -M counter increments exactly
                  # once per failed test at its exception, so the group matches an
                  # [E] whose counter is one above the counter in effect when the
                  # group opened; once that window passes they are dropped rather
                  # than pinned on a later failure.
                  nonlocal pending_blocks, block_pre_m
                  if not pending_blocks:
                      return []
                  matched, keep = [], []
                  for o, b in pending_blocks:
                      bf = block_file(b)
                      same_file = (bf is None or fname is None or
                                   bf.endswith(fname) or fname.endswith(bf))
                      wrapped = (bf is not None and fname is not None and same_file
                                 and o is not None and owner is not None
                                 and owner.startswith(o) and o != owner)
                      if (o == owner and same_file) or wrapped:
                          matched.append(b)
                      elif o is not None:
                          keep.append((o, b))
                  if matched:
                      pending_blocks = keep
                      return [l for b in matched for l in b]
                  if all(o is None and block_file(b) is None
                         for o, b in pending_blocks):
                      pre = block_pre_m
                      if pre is not None and m == pre + 1:
                          group = [l for _, b in pending_blocks for l in b]
                          pending_blocks = []
                          block_pre_m = None
                          return group
                  pending_blocks = keep  # ownerless leftovers are never claimable
                  block_pre_m = None
                  return []

              for raw in lines:
                  if PROG.match(raw):
                      msg = PROG.sub("", raw, count=1).strip()
                      m = line_counter(raw)
                      last_m = m
                      flush()
                      if msg.endswith("[E]"):
                          nm = msg[:-3].strip()
                          failure_exc = claim(m, name_file(nm), nm)
                          name = nm
                          cur_owner = nm
                          pending = ""
                      else:
                          cur_owner = msg
                          pending = msg
                  elif collecting:
                      if BANNER_CLOSE.match(raw):
                          collecting = False
                      else:
                          cur_block.append(raw.rstrip())
                  elif BANNER_OPEN.match(raw):
                      flush()
                      cur_block = []
                      if not pending_blocks:
                          block_pre_m = last_m
                      pending_blocks.append((cur_owner, cur_block))
                      collecting = True   # consecutive blocks accumulate for one owner
                  elif raw.strip():
                      if name is not None:
                          err.append(raw.rstrip())
                      elif pending and raw.startswith("  "):
                          stripped = raw.strip()
                          if stripped.endswith("[E]"):
                              nm = (pending + " " + stripped[:-3]).strip()
                              failure_exc = claim(last_m, name_file(nm), nm)
                              name = nm
                              cur_owner = nm
                              pending = ""
                          else:
                              pending = pending + " " + stripped
                  elif name is not None:
                      flush()            # blank line terminates a matcher paragraph
              flush()
              return failures

          analyze_outcome = os.environ.get("ANALYZE_OUTCOME", "success")
          test_outcome = os.environ.get("TEST_OUTCOME", "success")

          write_block("## Quality checks failed\n\n")

          if analyze_outcome != "success":
              write_block("### Static analysis failed\n\n")
              try:
                  with open("analyze_output.txt", encoding="utf-8", errors="replace") as f:
                      analyze_text = f.read()
              except OSError:
                  analyze_text = "(analyze_output.txt not found)"
              write_block(codeblock(analyze_text[:ANALYZE_MAX_CHARS]))
              if len(analyze_text) > ANALYZE_MAX_CHARS:
                  write_block("_Truncated; the full output is in the job log._\n\n")
              write_block("\n")
          else:
              write_block("### Static analysis passed\n\n")

          if test_outcome != "success":
              write_block("### Tests failed\n\n")
              try:
                  with open("test_output.txt", encoding="utf-8", errors="replace") as f:
                      test_lines = f.read().splitlines()
              except OSError:
                  test_lines = ["(test_output.txt not found)"]

              failures = parse_failures(test_lines)
              if failures:
                  write_block(f"{len(failures)} failing test(s):\n\n")
                  for test_name, err_text, from_exc in failures:
                      block = "- `" + test_name + "`\n"
                      if err_text:
                          limit = EXC_MAX_CHARS if from_exc else ERROR_MAX_CHARS
                          shown = err_text[:limit]
                          if len(err_text) > limit:
                              shown = shown + "\n…"
                          block = block + "  " + codeblock(shown).replace("\n", "\n  ") + "\n"
                      write_block(block)
              else:
                  # No [E] markers: usually a compile/load error. Show a
                  # capped tail so the summary still points at the cause.
                  if test_lines:
                      tail = "\n".join(test_lines[-TAIL_LINES:])
                      write_block(codeblock(tail[:TAIL_MAX_CHARS]) + "\n")
                  else:
                      write_block("(test_output.txt is empty)\n")
          else:
              write_block("### All tests passed\n\n")

          if truncated:
              summary.write(
                  "\n> Output truncated to stay under GitHub's 1MB step-summary"
                  " limit; the full log is in the job log (Static analysis /"
                  " Run tests steps).\n"
              )
          summary.close()
          PYEOF

      # ── Step 4: Pass/fail enforcement ────────────────────
      - name: Enforce checks
        if: steps.analyze.outcome != 'success' || steps.test.outcome != 'success'
        env:
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          echo "──────────────────────────────────────────────"
          echo "Quality gate blocked - see summary above."
          echo ""
          if [ "$ANALYZE_OUTCOME" != "success" ]; then
            echo "   FAILED: flutter analyze"
          else
            echo "   PASSED:  flutter analyze"
          fi
          if [ "$TEST_OUTCOME" != "success" ]; then
            echo "   FAILED: flutter test"
          else
            echo "   PASSED:  flutter test"
          fi
          echo "──────────────────────────────────────────────"
          exit 1

      - name: All checks passed
        if: steps.analyze.outcome == 'success' && steps.test.outcome == 'success'
        run: |
          {
            echo "## All quality checks passed"
            echo "- Static analysis: clean"
            echo "- All tests: passing"
          } >> "$GITHUB_STEP_SUMMARY"
